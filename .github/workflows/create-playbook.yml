name: Create New Playbook
on:
  workflow_dispatch:
    inputs:
      owner:
        description: Approved organization or account owner
        required: true
      repository:
        description: New private repository name (lowercase, hyphens)
        required: true
      name:
        description: Any playbook topic or title
        required: true
      value_thesis:
        description: Customer problem and intended outcome
        required: true
      request_id:
        description: Stable unique request ID for safe retries (8-64 characters)
        required: true
permissions:
  contents: read
concurrency:
  group: provision-${{ github.event.inputs.owner }}-${{ github.event.inputs.repository }}
  cancel-in-progress: false
jobs:
  provision:
    environment: provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.22.0'
      - name: Provision without executing contributed content
        run: node platform/provision.mjs
        env:
          GH_TOKEN: ${{ secrets.PROVISION_TOKEN }}
          PROVISION_ALLOWED_OWNER: ${{ vars.PROVISION_ALLOWED_OWNER }}
          PROVISION_ALLOWED_ACTORS: ${{ vars.PROVISION_ALLOWED_ACTORS }}
          PLATFORM_REPOSITORY: ${{ vars.PLATFORM_REPOSITORY }}